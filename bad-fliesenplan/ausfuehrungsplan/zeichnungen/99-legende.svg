<text x="0" y="40" font-size="11.5" fill="#444">Fugen 3 mm · Reihenhöhen von unten: 26,6 / 6× 30 / 26,3 cm → Fugen genau auf Fensterbank (0,875) und Waschtisch-Ablage (1,175) · Maße aus Plan „03A Dachgeschoss“, auf der Baustelle nachmessen!</text>

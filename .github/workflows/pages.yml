name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: KI-Stimme (meSpeak) einbinden
        continue-on-error: true
        run: |
          set -e
          mkdir -p site/vendor/mespeak
          npm pack mespeak@2.0.2 --silent
          tar -xzf mespeak-*.tgz
          cp -r package/voices site/vendor/mespeak/
          cp package/src/mespeak_config.json site/vendor/mespeak/
          # CommonJS-Paket als Browser-Skript verpacken (window.meSpeak)
          {
            echo 'window.meSpeak=(function(){var __ESpeak=(function(){var module={exports:{}},exports=module.exports;'
            cat package/src/ESpeak.js
            echo ';return module.exports;})();var module={exports:{}},exports=module.exports;var require=function(p){if(/ESpeak/.test(p))return __ESpeak;throw new Error("require "+p);};'
            cat package/src/index.js
            echo ';return module.exports;})();'
          } > site/vendor/mespeak/mespeak.js
          ls -la site/vendor/mespeak site/vendor/mespeak/voices | head -40
      - name: App bauen
        run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
